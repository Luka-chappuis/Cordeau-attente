:root{--orange:#f07918;--navy:#1a3a5c;--bg-page:#fbf6ed;--font-title:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box}a{text-decoration:none}html,body{margin:0;padding:0}body{background:var(--bg-page);font-family:system-ui,sans-serif}
/* Page d'attente cordeau.pro : le logo au centre, les 5 artisans en orbite */
.wait {
  --size: min(calc(100vh - 180px), calc(100svh - 180px), 680px, 92vw);
  --sat: calc(var(--size) * 0.17);
  --turn: 48s;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vh, 20px);
  padding: 24px 16px;
  background: var(--bg-page);
  position: relative;
  overflow: hidden;
}

/* Orbite : un cercle qui tourne, chaque artisan tourne en sens inverse pour rester debout */
.wait-orbit { position: relative; width: var(--size); height: var(--size); flex: none; }
.wait-orbit::before {
  content: "";
  position: absolute;
  inset: calc(var(--sat) * 0.5);
  border-radius: 50%;
  border: 2px dashed rgba(240, 121, 24, 0.35);
}
.wait-ring { position: absolute; inset: 0; animation: wait-spin var(--turn) linear infinite; }
.wait-sat {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--sat);
  height: calc(var(--sat) * 1.5);
  margin: calc(var(--sat) * -0.75) 0 0 calc(var(--sat) * -0.5);
  transform: rotate(calc(var(--i) * 72deg)) translateY(calc(var(--size) / -2 + var(--sat) * 0.75)) rotate(calc(var(--i) * -72deg));
}
.wait-sat img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter: drop-shadow(0 8px 10px rgba(26, 58, 92, 0.16));
  animation: wait-spin var(--turn) linear infinite reverse;
}
@keyframes wait-spin { to { transform: rotate(360deg); } }

/* Logo au centre de l'orbite */
.wait-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}
.wait-logo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--size) * 0.012); }
.wait-logo svg { width: calc(var(--size) * 0.1); height: auto; }
.wait-logo h1 {
  margin: 0;
  font-family: var(--font-title);
  font-weight: 600;
  font-size: calc(var(--size) * 0.092);
  letter-spacing: -0.035em;
  line-height: 1;
  color: var(--navy);
}
.wait-logo h1 span { color: var(--orange); }
.wait-contact { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.wait-ask {
  margin: 0;
  font-family: var(--font-title);
  font-weight: 600;
  font-size: 17px;
  color: var(--navy);
}
.wait-cta {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 22px;
  border-radius: 999px;
  background: var(--navy);
  color: #fbf6ed;
  font-family: var(--font-title);
  font-weight: 600;
  font-size: 14.5px;
  transition: background 0.15s;
}
.wait-cta:hover { background: #12293f; }
.wait-cta:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .wait-ring, .wait-sat img { animation: none; }
}

</style>
</head>
